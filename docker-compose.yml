services:
  app:
    build: .
    image: project22-jenkins-demo:local
    ports:
      - "3000:3000"
    environment:
      APP_VERSION: local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
